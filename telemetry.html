<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trickplayer — link telemetry</title>
    <link rel="stylesheet" href="/src/style.css" />

    <!-- The BROWSER entry point for the recorder. In the packaged app the same
         recorder is reached by a button and nothing navigates, because on the

         built by src/logging.ts, and the flow is fetched from index.html at
         runtime, so there is one copy of each. -->
    <div id="tlm-app"></div>

    <script type="importmap">
      {
        "imports": {
          "@evenrealities/even_hub_sdk": "https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk@0.0.14/+esm"
        }
      }
    </script>
    <script type="module" src="/src/telemetryapp.ts"></script>
  </body>
