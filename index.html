<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trickplayer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The flow is one panel at a time, in the order of
         trickplayer-knowledge/UI.md:
             sources -> browse -> list -> item -> player
         The sources panel is SKIPPED entirely when there is exactly one
         source; it is not a screen you dismiss. -->

    <div class="status-bar">
      <span class="status-indicator" id="status-indicator"></span>
      <span id="even-status">Starting…</span>
    </div>

    <!-- ============================ SOURCES ============================ -->
    <div class="section hidden" id="panel-sources">
      <h2>Your servers</h2>
      <div id="source-list"></div>
      <button class="btn-secondary" id="add-source-btn">Add a server</button>
      <button class="btn-secondary hidden" id="sources-back">Back</button>
    </div>

    <!-- ========================== ADD SOURCE =========================== -->
    <div class="section hidden" id="panel-add-source">
      <h2>Add a server</h2>

      <div id="add-step-provider">
        <p class="text-muted">Which kind of server?</p>
        <button class="btn-secondary" data-provider="plex">Plex</button>
        <button class="btn-secondary" data-provider="jellyfin">Jellyfin</button>
      </div>

      <!-- Jellyfin only: the address IS the identity, so it comes before
           auth and there is no server list to discover. -->
      <div id="add-step-address" class="hidden">
        <div class="input-group">
          <label for="jf-address">Server address</label>
          <input id="jf-address" type="url" placeholder="http://192.168.1.10:8096" />
        </div>
        <button class="btn-secondary" id="jf-address-next">Continue</button>
      </div>

      <!-- Plex only: the account service lists servers, and there may be
           several. Jellyfin has nothing to list — the address IS the server. -->
      <div id="add-step-server" class="hidden">
        <p class="text-muted">Which server?</p>
        <div id="server-list"></div>
      </div>

      <!-- Both providers: mint a short code, show it, poll. -->
      <div id="add-step-code" class="hidden">
        <p class="text-muted" id="code-instruction"></p>
        <div class="pin-container"><div class="pin-display" id="code-display">••••</div></div>
        <p class="text-muted" id="code-status">Waiting for you to approve it…</p>
        <button class="btn-secondary" id="code-check-now">I've entered it</button>
      </div>

      <button class="btn-secondary" id="add-source-cancel">Cancel</button>
    </div>

    <!-- ============================ BROWSE ============================= -->
    <div class="section hidden" id="panel-browse">
      <h2 id="browse-title">Browse</h2>
      <div id="root-list"></div>
      <button class="btn-secondary hidden" id="browse-back">Servers</button>
    </div>

    <!-- ============================= LIST ============================== -->
    <div class="section hidden" id="panel-list">
      <h2 id="list-title">…</h2>
      <p class="text-muted" id="list-status"></p>
      <div id="results-list"></div>
      <button class="btn-secondary" id="list-back">Back</button>
    </div>

    <!-- ============================= ITEM ============================== -->
    <div class="section hidden" id="panel-item">
      <h2 id="item-title">…</h2>

      <!-- Preview: loads automatically when it is cheap, and asks first when
           it is not. The provider supplies the estimate. -->
      <div id="preview-area">
        <div id="preview-strip"></div>
        <p class="text-muted" id="preview-note"></p>
        <button class="btn-secondary hidden" id="preview-load">Preview</button>
      </div>

      <h3>Options</h3>

      <div class="control-row">
        <label for="opt-skip-silent">Skip scenes with no subtitles</label>
        <input type="checkbox" id="opt-skip-silent" checked />
      </div>
      <p class="text-muted" id="skip-silent-note"></p>

      <div class="control-row">
        <label for="opt-bandwidth">Bandwidth</label>
        <input type="range" id="opt-bandwidth" min="0" max="2" step="1" value="2" />
      </div>
      <div class="control-row">
        <span class="text-muted">Fewer images</span>
        <span class="text-muted">Every scene</span>
      </div>
      <p class="text-muted" id="bandwidth-note"></p>

      <h3>Picture</h3>
      <div class="control-row">
        <label for="opt-contrast">Contrast</label>
        <input type="range" id="opt-contrast" min="-100" max="100" step="1" value="0" />
      </div>
      <div class="control-row">
        <label>Texture</label>
        <span class="segmented">
          <button class="btn-secondary active" data-texture="floyd-steinberg">Smooth</button>
          <button class="btn-secondary" data-texture="atkinson">Crisp</button>
          <button class="btn-secondary" data-texture="threshold">Flat</button>
        </span>
      </div>
      <details>
        <summary class="text-muted">More picture settings</summary>
        <div class="control-row">
          <label for="opt-brightness">Brightness</label>
          <input type="range" id="opt-brightness" min="-100" max="100" step="1" value="0" />
        </div>
        <div class="control-row">
          <label for="opt-gamma">Gamma</label>
          <input type="range" id="opt-gamma" min="50" max="200" step="5" value="100" />
        </div>
        <button class="btn-secondary" id="picture-reset">Reset picture</button>
      </details>

      <button class="btn-secondary" id="item-play">Play on glasses</button>
      <button class="btn-secondary" id="item-back">Back</button>
    </div>

    <!-- ============================ PLAYER ============================= -->
    <div class="section hidden" id="panel-player">
      <h2 id="playing-title">…</h2>

      <div class="load-progress-container hidden" id="load-progress-container">
        <div class="load-progress-label" id="load-progress-label"></div>
        <div class="load-progress-track"><div class="load-progress-fill" id="load-progress-fill"></div></div>
      </div>

      <div id="player-container">
        <img id="seek-image" alt="" />
        <div id="subtitle-overlay"></div>
      </div>

      <div id="controls">
        <button class="btn-secondary" id="play-btn">Play</button>
        <input type="range" id="timeline" min="0" max="0" value="0" />
        <span id="time-display">0:00</span>
      </div>

      <button class="btn-danger" id="close-player-btn">Stop</button>
    </div>

    <!-- Import Map Configuration to Bind Even Realities Web Ecosystem Libraries.
         Pinned to an explicit version — the bare "+esm" URL resolves to
         npm's "latest" tag, so every future SDK release would silently
         change runtime behavior on next page load with no chance to test
         it first. Bump this deliberately alongside package.json. -->
    <script type="importmap">
      {
        "imports": {
          "@evenrealities/even_hub_sdk": "https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk@0.0.14/+esm"
        }
      }
    </script>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
